---
filebeat_version: 7.10.2

wazuh_template_branch: v4.14.9
# Where the Wazuh alerts template is fetched from. Override it to point to an internal mirror.
wazuh_template_url: "https://raw.githubusercontent.com/wazuh/wazuh/{{ wazuh_template_branch }}/extensions/elasticsearch/7.x/wazuh-template.json"

filebeat_node_name: node-1

filebeat_output_indexer_hosts:
  - "localhost"

filebeat_module_package_name: wazuh-filebeat-0.5.tar.gz
filebeat_module_package_path: /tmp/
filebeat_module_destination: /usr/share/filebeat/module
filebeat_module_folder: /usr/share/filebeat/module/wazuh
indexer_security_user: admin
indexer_security_password: changeme
# Security plugin
filebeat_security: true
filebeat_ssl_dir: /etc/pki/filebeat

# Local path to store the generated certificates (Opensearch security plugin)
local_certs_path: "{{ playbook_dir }}/indexer/certificates"
