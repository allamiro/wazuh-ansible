---
# ===========================================================================
# Distributed HA Wazuh — core cluster (no HAProxy, no hot/warm/cold tiering)
#
# Topology:
#   - 5 indexers  : hot x3, warm x1, cold x1  (one OpenSearch cluster)
#   - Wazuh server: 1 master + 2 workers
#   - 1 dashboard
#
# Shared topology (instances / indexer hosts / dashboard targets) is defined
# once in inventory/group_vars/all.yml so every play sees it.
# Self-signed certificates are generated automatically (generate_certs=true).
#
# Run:  ansible-playbook wazuh-distributed.yml -b -K
# ===========================================================================

- name: Set hostnames and populate /etc/hosts cluster-wide
  hosts: all
  become: true
  tasks:
    - name: Set the system hostname to its tier FQDN
      ansible.builtin.hostname:
        name: "{{ node_fqdn }}"

    - name: Ensure /etc/hosts has an entry for every cluster node
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "\\b{{ hostvars[item].node_fqdn | regex_escape }}\\b"
        line: "{{ hostvars[item].private_ip }} {{ hostvars[item].node_fqdn }} {{ hostvars[item].node_fqdn.split('.')[0] }}"
        state: present
      loop: "{{ groups['all'] }}"
      loop_control:
        label: "{{ hostvars[item].node_fqdn }}"

- name: Configure package URLs
  hosts: localhost
  roles:
    - role: package-urls
  run_once: true
  become: false

- name: Configure Wazuh Indexer cluster
  hosts: indexer_cluster
  become: true
  roles:
    - role: wazuh-indexer

- name: Configure Wazuh Manager (master)
  hosts: wazuh_manager_master
  become: true
  roles:
    - role: wazuh-manager
  vars:
    node_type: "master"
    manager_node_name: "{{ instances[inventory_hostname].name }}"

- name: Configure Wazuh Manager (workers)
  hosts: wazuh_manager_worker
  become: true
  roles:
    - role: wazuh-manager
  vars:
    node_type: "worker"
    manager_node_name: "{{ instances[inventory_hostname].name }}"

- name: Configure Wazuh Dashboard
  hosts: wazuh_dashboard
  become: true
  roles:
    - role: wazuh-dashboard
  vars:
    dashboard_node_name: "{{ instances[inventory_hostname].name }}"
